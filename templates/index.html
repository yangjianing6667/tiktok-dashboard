<body class="min-h-screen font-sans antialiased">
    <style id="critical-layout">
      :root {
        --sidebar-w: 280px;
        --c-ink: #E8ECF4;
        --c-ink-2: rgba(232, 236, 244, 0.65);
        --c-ink-3: rgba(232, 236, 244, 0.40);
        --c-line: rgba(255, 255, 255, 0.08);
        --c-line-bright: rgba(255, 255, 255, 0.12);
        --c-bg: #080C14;
        --c-sidebar-bg: #060A10;
        --c-success: #10B981;
        --c-warning: #F59E0B;
        --c-error: #EF4444;
        --c-brand: #4FACFE;
        --c-brand-light: #00F2FE;
        --c-burst: #F5576C;
        --c-burst-light: #F093FB;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--c-bg);
        color: var(--c-ink);
        font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', system-ui, -apple-system, sans-serif;
        position: relative;
        min-height: 100vh;
        overflow-x: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at 50% 30%, rgba(79, 172, 254, 0.10), rgba(240, 147, 251, 0.06) 40%, transparent 70%);
        opacity: 0.5;
        pointer-events: none;
        z-index: 0;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background-image: radial-gradient(circle, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
        background-size: 24px 24px;
        pointer-events: none;
        z-index: 0;
      }
      .app-sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: var(--sidebar-w);
        background: var(--c-sidebar-bg);
        border-right: 1px solid var(--c-line);
        z-index: 20;
        display: flex;
        flex-direction: column;
        padding: 24px 20px;
        gap: 24px;
        overflow-y: auto;
      }
      .app-main {
        margin-left: var(--sidebar-w);
        padding: 32px;
        position: relative;
        z-index: 1;
        min-width: 0;
      }
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }
      .chart-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .table-section { width: 100%; }
      .glass-card {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.03));
        border: 1px solid var(--c-line);
        border-radius: 12px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        transition: transform 0.2s cubic-bezier(.2,.8,.2,1), border-color 0.2s, box-shadow 0.2s;
      }
      .glass-card:hover {
        border-color: rgba(79, 172, 254, 0.4);
        transform: translateY(-4px);
        box-shadow: 0 12px 40px rgba(79, 172, 254, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.10); border-radius: 8px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.18); }
      @keyframes growIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
      .grow-in { animation: growIn 0.6s ease-out; }
      @keyframes pulseGlow {
        0%, 100% { box-shadow: 0 0 8px rgba(240, 147, 251, 0.20); }
        50% { box-shadow: 0 0 20px rgba(240, 147, 251, 0.50); }
      }
      .pulse-glow { animation: pulseGlow 2.4s ease-in-out infinite; }
      .text-ink { color: var(--c-ink); }
      .text-ink-2 { color: var(--c-ink-2); }
      .text-ink-3 { color: var(--c-ink-3); }
      .seg { display: inline-flex; background: rgba(255,255,255,0.04); border: 1px solid var(--c-line); border-radius: 10px; padding: 3px; gap: 2px; }
      .seg button {
        border: none; background: transparent; color: var(--c-ink-2);
        padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 500;
        cursor: pointer; transition: all 0.18s; display: inline-flex; align-items: center; gap: 6px;
      }
      .seg button:hover { color: var(--c-ink); }
      .seg button.active {
        background: linear-gradient(135deg, var(--c-brand-light), var(--c-brand));
        color: #050A12; font-weight: 600;
        box-shadow: 0 2px 8px rgba(79,172,254,0.35);
      }
      .ghost-btn {
        display: inline-flex; align-items: center; gap: 6px;
        background: rgba(255,255,255,0.03); border: 1px solid var(--c-line); color: var(--c-ink-2);
        padding: 8px 14px; border-radius: 9px; font-size: 13px; font-weight: 500; cursor: pointer;
        transition: all 0.18s;
      }
      .ghost-btn:hover { color: var(--c-ink); border-color: rgba(79,172,254,0.4); background: rgba(79,172,254,0.06); }
      .section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
      .section-title h2 { font-size: 16px; font-weight: 600; color: var(--c-ink); margin: 0; display: flex; align-items: center; gap: 10px; }
      .kpi-card { position: relative; padding: 20px; overflow: hidden; }
      .kpi-card .accent-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 0 3px 3px 0; }
      .kpi-value { font-size: 30px; font-weight: 700; line-height: 1.1; margin-top: 12px; letter-spacing: -0.02em; }
      .kpi-label { color: var(--c-ink-2); font-size: 13px; margin-top: 8px; display: flex; align-items: center; gap: 6px; }
      .grad-text {
        background: linear-gradient(135deg, var(--c-brand-light), var(--c-brand));
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
      }
      .grad-text-burst {
        background: linear-gradient(135deg, var(--c-burst-light), var(--c-burst));
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
      }
      .grad-text-green {
        background: linear-gradient(135deg, #34D399, var(--c-success));
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
      }
      .capsule { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; font-size: 12px; cursor: pointer; border: 1px solid var(--c-line); background: rgba(255,255,255,0.03); color: var(--c-ink-2); transition: all 0.18s; user-select: none; }
      .capsule input { display: none; }
      .capsule:hover { color: var(--c-ink); border-color: var(--c-line-bright); }
      .capsule.checked { background: rgba(79,172,254,0.12); border-color: rgba(79,172,254,0.5); color: var(--c-brand); }
      .legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--c-ink-2); padding: 5px 0; }
      .legend-dot { width: 9px; height: 9px; border-radius: 3px; }
      .data-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
      .data-table thead th {
        text-align: left; padding: 12px 14px; color: var(--c-ink-2); font-weight: 500; font-size: 12px;
        border-bottom: 1px solid var(--c-line); white-space: nowrap; background: rgba(255,255,255,0.02);
      }
      .data-table tbody td { padding: 12px 14px; border-bottom: 1px solid var(--c-line); color: var(--c-ink); vertical-align: middle; }
      .data-table tbody tr { transition: background 0.15s; }
      .data-table tbody tr:hover { background: rgba(79,172,254,0.05); }
      .data-table .th-sort { cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 4px; }
      .data-table .th-sort:hover { color: var(--c-ink); }
      .data-table .th-sort.active { color: var(--c-brand); }
      .thumb { width: 40px; height: 40px; border-radius: 9px; background: linear-gradient(135deg, rgba(79,172,254,0.3), rgba(240,147,251,0.3)); border: 1px solid var(--c-line-bright); display: inline-flex; align-items: center; justify-content: center; color: var(--c-ink-3); flex-shrink: 0; }
      .tag-pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 500; }
      .progress-track { width: 100%; max-width: 110px; height: 6px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
      .progress-fill { height: 100%; border-radius: 999px; transition: width 0.6s cubic-bezier(.2,.8,.2,1); }
      .page-btn { min-width: 32px; height: 32px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--c-line); background: rgba(255,255,255,0.03); color: var(--c-ink-2); font-size: 13px; cursor: pointer; transition: all 0.15s; }
      .page-btn:hover:not(:disabled) { color: var(--c-ink); border-color: var(--c-line-bright); }
      .page-btn.active { background: linear-gradient(135deg, var(--c-brand-light), var(--c-brand)); color: #050A12; border-color: transparent; font-weight: 600; }
      .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
      .search-input { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.04); border: 1px solid var(--c-line); border-radius: 9px; padding: 8px 12px; }
      .search-input input { background: transparent; border: none; outline: none; color: var(--c-ink); font-size: 13px; width: 240px; }
      .search-input input::placeholder { color: var(--c-ink-3); }
      .date-input { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--c-line); border-radius: 9px; padding: 8px 11px; color: var(--c-ink-2); font-size: 12px; outline: none; }
      .date-input::-webkit-calendar-picker-indicator { filter: invert(0.7); }
      .lucide-wrp { display: inline-flex; align-items: center; justify-content: center; }
      .lucide-wrp svg { width: 16px; height: 16px; stroke-width: 2; }
      .chart-box { padding: 20px; height: 320px; }
      .bar-row-label { display: inline-flex; align-items: center; gap: 4px; color: var(--c-burst-light); font-weight: 600; font-size: 12px; }

      /* Heatmap */
      .heatmap-grid { display: grid; gap: 4px; }
      .heatmap-cell { border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; cursor: pointer; transition: transform 0.15s; }
      .heatmap-cell:hover { transform: scale(1.08); z-index: 2; }
      .heatmap-legend { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--c-ink-3); }
      .heatmap-legend-bar { width: 80px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, rgba(79,172,254,0.2), rgba(79,172,254,0.6), rgba(240,147,251,0.8), var(--c-burst)); }

      /* Loading skeleton */
      .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%); background-size: 200% 100%; animation: skeleton 1.2s infinite; border-radius: 6px; }
      @keyframes skeleton { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

      /* Toast */
      .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 18px; border-radius: 10px; background: var(--c-sidebar-bg); border: 1px solid var(--c-line); color: var(--c-ink); font-size: 13px; box-shadow: var(--shadow-float); z-index: 100; transform: translateY(120%); transition: transform 0.35s cubic-bezier(.2,.8,.2,1); }
      .toast.show { transform: translateY(0); }

      @media (prefers-reduced-motion: reduce) {
        .grow-in, .pulse-glow { animation: none !important; }
        .glass-card { transition: none !important; }
        .kpi-value { transition: none !important; }
      }
      @media (max-width: 1200px) {
        .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .chart-grid { grid-template-columns: 1fr; }
      }
      @media (max-width: 760px) {
        .app-sidebar { position: relative; width: 100%; height: auto; bottom: auto; border-right: none; border-bottom: 1px solid var(--c-line); }
        .app-main { margin-left: 0; padding: 16px; }
        .kpi-grid { grid-template-columns: 1fr; }
        .search-input input { width: 160px; }
      }
    </style>

          <div id="genreFilter" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
        </div>

        <div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--c-line);font-size:11px;color:var(--c-ink-3);display:flex;align-items:center;gap:6px;">
          <i data-lucide="clock" class="lucide-wrp"></i>
          <span id="lastUpdated">最后更新: --</span>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <div class="app-main">
        <!-- KPI CARDS -->
        <section class="kpi-grid" style="margin-bottom:24px;">
          <div class="glass-card kpi-card">
            <span class="accent-bar" style="background:linear-gradient(180deg,#00F2FE,#4FACFE);"></span>
            <div class="kpi-label"><i data-lucide="film" class="lucide-wrp"></i>在榜剧集总数</div>
            <div class="kpi-value grad-text" data-kpi="totalDrama" data-suffix="">0</div>
          </div>
          <div class="glass-card kpi-card">
            <span class="accent-bar" style="background:linear-gradient(180deg,#00F2FE,#4FACFE);"></span>
            <div class="kpi-label"><i data-lucide="play" class="lucide-wrp"></i>总播放量 VV</div>
            <div class="kpi-value grad-text" data-kpi="totalVV" data-suffix="W" data-decimals="1">0</div>
          </div>
          <div class="glass-card kpi-card">
            <span class="accent-bar" style="background:linear-gradient(180deg,#34D399,#10B981);"></span>
            <div class="kpi-label"><i data-lucide="check-circle-2" class="lucide-wrp"></i>平均完播率</div>
            <div class="kpi-value grad-text-green" data-kpi="avgCompletion" data-suffix="%" data-decimals="1">0</div>
          </div>
          <div class="glass-card kpi-card">
            <span class="accent-bar" style="background:linear-gradient(180deg,#F093FB,#F5576C);"></span>
            <div class="kpi-label"><i data-lucide="trending-up" class="lucide-wrp"></i>飙升新题材数</div>
            <div class="kpi-value grad-text-burst" data-kpi="emergingCount" data-suffix="">0</div>
          </div>
        </section>

        <!-- AI CLUSTERING -->
        <section class="glass-card" style="padding:20px;margin-bottom:24px;">
          <div class="section-title">
            <h2><i data-lucide="brain" class="lucide-wrp" style="color:var(--c-brand);"></i>DeepSeek 题材聚类洞察</h2>
            <button class="ghost-btn" id="refreshAnalysis"><i data-lucide="refresh-cw" class="lucide-wrp"></i>刷新分析</button>
          </div>
          <div class="chart-grid" style="margin-bottom:20px;">
            <div>
              <div style="font-size:13px;color:var(--c-ink-2);margin-bottom:12px;display:flex;align-items:center;gap:6px;">
                <span style="width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,#00F2FE,#4FACFE);"></span>成熟赛道 · 稳态分布
              </div>
              <div class="grow-in" style="height:340px;padding:0;display:flex;flex-direction:column;gap:8px;">
                <div style="flex:1;position:relative;min-height:200px;">
                  <canvas id="donutChartCanvas"></canvas>
                </div>
                <div id="donutLegend" style="display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;padding:0 8px 4px;"></div>
              </div>
            </div>
            <div>
              <div style="font-size:13px;color:var(--c-ink-2);margin-bottom:12px;display:flex;align-items:center;gap:6px;">
                <span style="width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,#F093FB,#F5576C);"></span>起量新题材 · 增速榜
              </div>
              <div class="grow-in" style="height:340px;padding:0;position:relative;">
                <canvas id="barChartCanvas" style="width:100%;height:100%;"></canvas>
              </div>
            </div>
          </div>
          <!-- Insights -->
          <div id="insightsBox" style="margin-top:0;padding-top:16px;border-top:1px solid var(--c-line);display:none;">
            <div style="font-size:12px;color:var(--c-ink-3);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.06em;">AI 洞察</div>
            <ul id="insightsList" style="margin:0;padding-left:18px;color:var(--c-ink-2);font-size:13px;line-height:1.8;"></ul>
          </div>
        </section>

        <!-- HEATMAP -->
        <section class="glass-card" style="padding:20px;margin-bottom:24px;">
          <div class="section-title">
            <h2><i data-lucide="flame" class="lucide-wrp" style="color:var(--c-brand);"></i>题材热度热力图</h2>
            <div class="heatmap-legend"><span>低</span><div class="heatmap-legend-bar"></div><span>高</span></div>
          </div>
          <div id="heatmapWrap" style="overflow-x:auto;">
            <div id="heatmap" class="grow-in"></div>
          </div>
        </section>

        <!-- DATA TABLE -->
        <section class="glass-card table-section" style="padding:20px;">
          <div class="section-title">
            <h2><i data-lucide="table-2" class="lucide-wrp" style="color:var(--c-brand);"></i>TOP 100 剧集榜单</h2>
            <div style="display:flex;align-items:center;gap:12px;">
              <div class="search-input">
                <i data-lucide="search" class="lucide-wrp"></i>
                <input type="text" id="tableSearch" placeholder="搜索剧集..." />
              </div>
              <button class="ghost-btn" id="exportCsv"><i data-lucide="download" class="lucide-wrp"></i>导出 CSV</button>
            </div>
          </div>
          <div style="overflow-x:auto;">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width:64px;">#排名</th>
                  <th>剧集标题</th>
                  <th>题材标签</th>
                  <th class="th-sort" data-sort="vv">播放量 <i data-lucide="chevrons-up-down" class="lucide-wrp" style="width:13px;height:13px;"></i></th>
                  <th class="th-sort" data-sort="completion">完播率 <i data-lucide="chevrons-up-down" class="lucide-wrp" style="width:13px;height:13px;"></i></th>
                  <th style="width:120px;">更新时间</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div id="pagination" style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:8px;flex-wrap:wrap;"></div>
        </section>
      </div>
    </main>

    <div id="toast" class="toast"></div>


    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
